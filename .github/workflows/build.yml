name: App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel     # wie FuFF Convert; die App wird trotzdem Universal (Apple Silicon + Intel)
    steps:
      - uses: actions/checkout@v5

      - name: App bauen (Universal)
        run: VERSION="0.1.${{ github.run_number }}" scripts/build_app.sh

      - name: Selbsttest der fertigen App (EDL → ORF-AKM-Liste)
        run: |
          APP="build/FuFF AKM-Liste.app"
          "$APP/Contents/MacOS/AKMListe" --cli \
            --edl Tests/fixtures/musik_synthetisch.edl \
            --tracks A1,A2 --rate 25 \
            --produktion Tests/fixtures/produktion_test.fuffprod \
            --out build/test_akm.xlsx
          "$APP/Contents/MacOS/AKMListe" --cli \
            --edl Tests/fixtures/musik_viele.edl \
            --tracks A1,A2 --rate 25 \
            --produktion Tests/fixtures/produktion_test.fuffprod \
            --out build/test_akm_viele.xlsx
          python3 -m pip install --quiet --break-system-packages openpyxl || python3 -m pip install --quiet openpyxl
          python3 Tests/check_xlsx.py build/test_akm.xlsx klein
          python3 Tests/check_xlsx.py build/test_akm_viele.xlsx viele

      - name: Suchtest MusicBrainz (echte Abfrage)
        run: |
          APP="build/FuFF AKM-Liste.app/Contents/MacOS/AKMListe"
          for q in "NICK CAVE & THE BAD SEEDS - RED RIGHT HAND" \
                   "THE GRAND BUDAPEST HOTEL - NIGHT TRAIN TO NEBELSBAD - ALEXANDRE DESPLAT" \
                   "CYMANDE GETTING IT BACK 1972"; do
            set +e; "$APP" --suche "$q"; rc=$?; set -e
            if [ $rc -eq 3 ]; then echo "::error::Kein Treffer für: $q"; exit 1; fi
            if [ $rc -eq 4 ]; then echo "::warning::MusicBrainz nicht erreichbar – Suchtest übersprungen"; fi
            if [ $rc -ne 0 ] && [ $rc -ne 4 ]; then echo "::error::Absturz bei: $q (Code $rc)"; exit 1; fi
          done

      - name: Als Download speichern
        uses: actions/upload-artifact@v5
        with:
          name: FuFF-AKM-Liste
          path: |
            build/FuFF-AKM-Liste.zip
            build/test_akm.xlsx
            build/test_akm_viele.xlsx

      - name: Release "Neueste Version" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/FuFF-AKM-Liste.zip \
            --title "FuFF AKM-Liste – neueste Version (Build ${{ github.run_number }})" \
            --notes "Automatisch gebaut aus dem aktuellen Stand. ZIP laden, entpacken, App in den Programme-Ordner ziehen. Läuft auf Apple Silicon und Intel ab macOS 13."
